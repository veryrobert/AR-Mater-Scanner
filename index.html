<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Marker Scanner</title>
<style>
  :root {
    --bg: #0b0d10; --fg: #f4f6f8; --muted: #9aa4af; --accent: #3fb8ff; --ok: #3ddc84; --warn: #ffb020;
    --panel: rgba(16,19,23,.82); --line: rgba(255,255,255,.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; }
  .view { position: fixed; inset: 0; display: none; }
  .view.active { display: block; }

  /* camera */
  #video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #video { object-fit: contain; background: #000; }
  #status { position: absolute; top: calc(env(safe-area-inset-top) + 14px); left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px;
    display: flex; gap: 10px; align-items: center; white-space: nowrap; backdrop-filter: blur(8px); }
  .dots { display: flex; gap: 4px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: #48505a; }
  .dots i.on { background: var(--ok); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    background: linear-gradient(to top, rgba(0,0,0,.7), transparent); }
  .side { display: flex; gap: 10px; }
  .side.right { justify-content: flex-end; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 44px; cursor: pointer; }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; background: rgba(255,255,255,.25); cursor: pointer; transition: background .15s, transform .1s; }
  #shutter:active { transform: scale(.94); }
  #shutter.ready { background: var(--ok); }
  #shutter:disabled { opacity: .45; }
  #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  #msg.show { display: flex; }
  #msg .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; max-width: 360px; }
  #msg h2 { margin: 0 0 8px; font-size: 18px; }
  #msg p { margin: 0 0 14px; color: var(--muted); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }

  /* result */
  #result { background: var(--bg); }
  #resultWrap { position: absolute; inset: 0 0 auto 0; bottom: calc(env(safe-area-inset-bottom) + 150px);
    padding: calc(env(safe-area-inset-top) + 16px) 16px 8px; display: flex; align-items: center; justify-content: center; }
  #out { max-width: 100%; max-height: 100%; box-shadow: 0 6px 30px rgba(0,0,0,.6); background: #fff; }
  .tools { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(env(safe-area-inset-bottom) + 16px);
    display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seg button { background: transparent; border: 0; padding: 10px 12px; min-height: 40px; cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #001018; }
  .primary { background: var(--accent); color: #001018; border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 600; min-height: 44px; cursor: pointer; }
  .ghost { background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; min-height: 44px; cursor: pointer; }
  .label { color: var(--muted); align-self: center; font-size: 13px; }
  #busy { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.5); font-weight: 600; }
  #busy.show { display: flex; }
  input[type=file] { display: none; }
</style>
</head>
<body>

<section id="camera" class="view active">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div id="flash"></div>
  <div id="status"><span class="dots"><i></i><i></i><i></i><i></i></span><span id="statusText">Starting camera…</span></div>
  <div id="msg"><div class="card">
    <h2 id="msgTitle">Camera unavailable</h2>
    <p id="msgText">You can still take or upload a photo and it will be straightened.</p>
    <button class="primary" id="msgPhoto">Take / choose photo</button>
  </div></div>
  <div class="bar">
    <div class="side"><button class="chip" id="photoBtn" aria-label="Take or choose a photo">Photo</button></div>
    <button id="shutter" aria-label="Capture" disabled></button>
    <div class="side right"><button class="chip" id="autoBtn" aria-pressed="false">Auto</button></div>
  </div>
  <input type="file" id="file" accept="image/*" capture="environment">
</section>

<section id="result" class="view">
  <div id="resultWrap"><canvas id="out"></canvas></div>
  <div class="tools">
    <div class="row">
      <span class="label">Crop to</span>
      <div class="seg" id="cropSeg">
        <button data-v="outer" aria-pressed="true">Outer</button>
        <button data-v="center" aria-pressed="false">Centres</button>
        <button data-v="inner" aria-pressed="false">Inner</button>
      </div>
      <div class="seg" id="enhSeg">
        <button data-v="0" aria-pressed="true">Original</button>
        <button data-v="1" aria-pressed="false">Clean</button>
      </div>
    </div>
    <div class="row">
      <button class="ghost" id="retake">Retake</button>
      <button class="primary" id="save">Save image</button>
    </div>
  </div>
</section>

<div id="busy">Straightening…</div>

<script src="scanner.js"></script>
<script src="app.js"></script>
</body>
</html>
